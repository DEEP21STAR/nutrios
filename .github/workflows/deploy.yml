name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # --ignore-scripts: onnxruntime-node (a transitive dep of @huggingface/transformers,
      # pulled in for its Node-native build even though this app only ever uses the browser/WASM
      # build) tries to download a platform binary on install and that download intermittently
      # times out on GitHub-hosted runners. It's never imported by the actual browser bundle —
      # verified locally that `vite build` produces an identical dist/ with scripts skipped.
      - run: npm ci --ignore-scripts
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
