<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- interactive-widget=resizes-content: on Chrome/Android, the on-screen keyboard shrinks
         the actual viewport instead of just the visual one, so `fixed`/`sticky` bottom UI (the
         onboarding wizard's Continue button) stays above the keyboard instead of hiding behind
         it until the keyboard is dismissed. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#0A0A0F" />
    <title>NUTRYOS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&family=Chakra+Petch:wght@600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <canvas id="starfield" style="position:fixed;inset:0;z-index:-1;pointer-events:none"></canvas>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      (function () {
        "use strict";
        var canvas = document.getElementById("starfield");
        if (!canvas) return;
        var ctx = canvas.getContext("2d");
        var stars = [];
        var COUNT = 200;
        var COLORS = ["255,255,255", "255,255,255", "0,229,160", "139,92,246"];
        var reduceMotion =
          window.matchMedia &&
          window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        function resize() {
          canvas.width = innerWidth;
          canvas.height = innerHeight;
        }
        function initStars() {
          resize();
          stars = [];
          for (var i = 0; i < COUNT; i++) {
            stars.push({
              x: Math.random() * canvas.width,
              y: Math.random() * canvas.height,
              r: Math.random() * 1.8 + 0.5,
              c: COLORS[Math.floor(Math.random() * COLORS.length)],
              phase: Math.random() * Math.PI * 2,
              speed: Math.random() * 0.4 + 0.15,
              vy: Math.random() * 0.02 + 0.006,
            });
          }
        }
        function frame(t) {
          ctx.fillStyle = "#0a0a0f";
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          for (var i = 0; i < stars.length; i++) {
            var s = stars[i];
            var tw = reduceMotion
              ? 0.7
              : 0.45 + 0.55 * Math.sin(t * 0.001 * s.speed + s.phase);
            ctx.beginPath();
            ctx.fillStyle = "rgba(" + s.c + "," + (0.3 + tw * 0.65) + ")";
            ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
            ctx.fill();
            if (!reduceMotion) {
              s.y += s.vy;
              if (s.y > canvas.height) s.y = 0;
            }
          }
          if (!reduceMotion) requestAnimationFrame(frame);
        }
        window.addEventListener("resize", resize);
        initStars();
        frame(0);
      })();
    </script>
  </body>
</html>
